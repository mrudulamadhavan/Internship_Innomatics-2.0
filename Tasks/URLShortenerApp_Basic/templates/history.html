<!DOCTYPE html>
<html>
<head>
    <title>History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background:#f5f6fa; }
        .url-cell { max-width: 420px; word-break: break-word; }
    </style>
</head>

<body>
<div class="container my-4">
    <div class="card shadow p-4 rounded-4">
        <div class="d-flex justify-content-between">
            <h2>📜 URL History</h2>
            <a href="/" class="btn btn-outline-dark">⬅ Home</a>
        </div>

        <hr>

        {% if allurls|length == 0 %}
            <p class="text-center text-muted">No URLs found.</p>
        {% else %}
        <div class="table-responsive">
            <table class="table table-bordered table-hover">
                <thead class="table-dark text-center">
                    <tr>
                        <th>S.No</th>
                        <th>Original URL</th>
                        <th>Short URL</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>
                    {% for item in allurls %}
                    <tr>
                        <td class="text-center">{{ loop.index }}</td>
                        <td class="url-cell">
                            <a href="{{ item.url }}" target="_blank">{{ item.url }}</a>
                        </td>
                        <td class="url-cell">
                            <a href="{{ item.shorter_url }}" target="_blank">{{ item.shorter_url }}</a>
                        </td>
                        <td class="text-center">
                            <a href="/delete/{{ item.id }}" class="btn btn-danger btn-sm"
                               onclick="return confirm('Delete this URL?')">Delete</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% endif %}
    </div>
</div>
</body>
</html>
