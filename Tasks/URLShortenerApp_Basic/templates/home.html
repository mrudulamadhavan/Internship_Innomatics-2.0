<!DOCTYPE html>
<html>
<head>
    <title>URL Shortener</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f5f6fa;">
<div class="container mt-5">
    <div class="card shadow p-4 rounded-4">
        <h2 class="text-center mb-4">🔗 URL Shortener</h2>

        <form method="POST">
            <label class="form-label">Enter URL</label>
            <input type="text" name="url" class="form-control" placeholder="https://example.com" required>
            <button class="btn btn-primary w-100 mt-3">Shorten URL</button>
        </form>

        {% if error %}
        <div class="alert alert-danger mt-3 text-center">
            {{ message }}
        </div>
        {% endif %}

        {% if original_url %}
        <div class="mt-4">
            <label class="form-label">Entered URL</label>
            <input type="text" class="form-control" value="{{ original_url }}" readonly>
        </div>
        {% endif %}

        {% if short_url %}
        <div class="mt-3">
            <label class="form-label">Shortened URL</label>
            <div class="input-group">
                <input type="text" id="shortUrl" class="form-control" value="{{ short_url }}" readonly>
                <button class="btn btn-success" onclick="copyUrl()">Copy</button>
            </div>
        </div>
        {% endif %}

        <div class="text-center mt-4">
            <a href="/History" class="btn btn-outline-dark">📜 View History</a>
        </div>
    </div>
</div>

<script>
function copyUrl() {
    let copyText = document.getElementById("shortUrl");
    copyText.select();
    navigator.clipboard.writeText(copyText.value);
    alert("Copied!");
}
</script>
</body>
</html>
