<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - URL Shortener</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f9fa;
      padding: 15px;
    }
    .home-card{
      width: 100%;
      max-width: 520px;
      border-radius: 18px;
    }
  </style>
</head>

<body>

<div class="card shadow-lg p-4 p-md-5 home-card text-center">
  <h2 class="fw-bold mb-2">🔗 URL Shortener</h2>
  <p class="text-muted mb-4">
    Shorten long URLs and save them securely by logging in.
  </p>

  <div class="d-grid gap-3">
    <a href="/login" class="btn btn-primary btn-lg fw-semibold">Login</a>
    <a href="/signup" class="btn btn-outline-dark btn-lg fw-semibold">Signup</a>
  </div>

  <hr class="my-4">

  <p class="text-muted mb-0">
    ⚡ Fast • 🔒 Secure • 📌 Saved History
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
